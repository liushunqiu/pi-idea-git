<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v3" />
    <title>Git</title>
    <style>
/* ---- src/theme.css ---- */
/*
 * IntelliJ IDEA palette and component styles.
 *
 * Colour provenance matters here, so the values are grouped by how solid the
 * evidence is:
 *
 *  - One deliberate deviation: JetBrains documents the light-theme deleted row
 *    as a neutral grey (#D7D6D6). Next to the green insertion it reads as
 *    "faded" rather than "removed", so a soft red is used instead. The other
 *    diff colours are the published ones.
 *  - Diff line backgrounds, the word-level fragment colour, the pane divider,
 *    the editor gutter change bars and the file-status colours are the values
 *    JetBrains prints in its own documentation/colour tables. They are used
 *    verbatim, light and dark.
 *  - Everything else is UI chrome (tool window background, borders, selection,
 *    toolbar) where JetBrains publishes no numbers. Those follow the look of
 *    IntelliJ Light and Darcula respectively rather than pretending to be
 *    pixel-exact.
 */

:root {
  color-scheme: light dark;

  /* ---- IntelliJ Light ---- */
  --bg: #ffffff;
  --chrome-bg: #f7f8fa;
  --panel-bg: #ffffff;
  --panel-alt: #f2f4f7;
  --border: #d1d5da;
  --border-soft: #ebecf0;
  --fg: #1f2328;
  --fg-secondary: #5a5d63;
  --fg-muted: #8c8c8c;
  --selection: #d4e2ff;
  --selection-inactive: #e8eaed;
  --hover: #edf1f7;
  --focus-ring: #2e5c99;

  --button-bg: #ffffff;
  --button-border: #c4c8cd;
  --button-hover: #f0f3f7;
  --button-primary-bg: #3871e0;
  --button-primary-fg: #ffffff;
  --button-primary-hover: #2f63c9;

  --input-bg: #ffffff;
  --input-border: #c4c8cd;

  --diff-inserted: #c6e4c1;
  --diff-modified: #e9eff9;
  --diff-deleted: #f7d2d2;
  --diff-fragment: #c6d7f0;
  --diff-divider: #ebecf0;

  --gutter-modified: #c3d6e8;
  --gutter-added: #c9dec1;
  --gutter-deleted: #d99b9b;
  --gutter-whitespace: #eddcbc;

  --status-added: #0a7700;
  --status-modified: #0032a0;
  --status-deleted: #616161;
  --status-merged: #7503dc;
  --status-conflict: #ff0000;
  --status-ignored: #727238;
  --status-renamed: #007c7c;
  --status-unversioned: #993300;

  --graph-head: #f0c000;
  --graph-local: #00a000;
  --graph-remote: #9b4fc9;
  --graph-tag: #999999;

  --toolbar-h: 32px;
  --row-h: 22px;
  --radius: 4px;
  --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
  --mono-font: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --ui-size: 12px;
  --mono-size: 12px;
}

:root[data-theme="dark"] {
  color-scheme: dark;

  /* ---- Darcula ---- */
  --bg: #3c3f41;
  --chrome-bg: #3c3f41;
  --panel-bg: #313335;
  --panel-alt: #2b2d2f;
  --border: #555555;
  --border-soft: #323438;
  --fg: #bbbbbb;
  --fg-secondary: #a9b1ba;
  --fg-muted: #808080;
  --selection: #2f65ca;
  --selection-inactive: #46484a;
  --hover: #4a4d4f;
  --focus-ring: #7aa2f7;

  --button-bg: #4c5052;
  --button-border: #5f6164;
  --button-hover: #5a5f62;
  --button-primary-bg: #365880;
  --button-primary-fg: #dce6f2;
  --button-primary-hover: #3f6a9a;

  --input-bg: #45494a;
  --input-border: #5f6164;

  --diff-inserted: #2b4034;
  --diff-modified: #28323d;
  --diff-deleted: #452a2e;
  --diff-fragment: #3e546e;
  /* Hue-matched fragments: a blue patch over a dark red row turns to mud. */
  --diff-fragment-deleted: #6d353b;
  --diff-fragment-inserted: #3d6249;
  --diff-divider: #323438;

  --gutter-modified: #374752;
  --gutter-added: #4a7a5c;
  --gutter-deleted: #a04c52;
  --gutter-whitespace: #4c4638;

  --status-added: #629755;
  --status-modified: #6897bb;
  --status-deleted: #6c6c6c;
  --status-merged: #9876aa;
  --status-conflict: #d5756c;
  --status-ignored: #848504;
  --status-renamed: #4b9e9e;
  --status-unversioned: #c07840;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  font: var(--ui-size) / 1.45 var(--ui-font);
  background: var(--chrome-bg);
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
}

/* The host owns a transparent drag band. It is 46px in a detached panel and
   0 in a docked view, and the host publishes the value either way. */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding-top: var(--pi-plugin-titlebar-height, 0px);
  background: var(--chrome-bg);
}

/* ---------------------------------------------------------------- toolbars */

.toolbar {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 2px;
  min-height: var(--toolbar-h);
  padding: 3px 4px;
  border-bottom: 1px solid var(--border-soft);
}

.toolbar-spacer {
  flex: 1 1 auto;
}

.toolbar-separator {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: var(--border);
}

/* --------------------------------------------------------------- controls */

button,
.tbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 22px;
  padding: 2px 8px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--fg);
  cursor: pointer;
  font: inherit;
  line-height: 1.3;
  white-space: nowrap;
}

button:hover:not(:disabled),
.tbtn:hover:not(:disabled) {
  background: var(--hover);
}

button:focus-visible,
.tbtn:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: -1px;
}

button:disabled {
  color: var(--fg-muted);
  cursor: default;
}

button.bordered {
  border-color: var(--button-border);
  background: var(--button-bg);
}

button.bordered:hover:not(:disabled) {
  background: var(--button-hover);
}

button.primary {
  border-color: var(--button-primary-bg);
  background: var(--button-primary-bg);
  color: var(--button-primary-fg);
  font-weight: 600;
}

button.primary:hover:not(:disabled) {
  background: var(--button-primary-hover);
}

button.primary:disabled {
  border-color: var(--button-border);
  background: var(--button-bg);
  color: var(--fg-muted);
}

button.icon {
  min-width: 24px;
  padding: 2px 5px;
}

button.icon svg {
  display: block;
}

.split-button {
  display: inline-flex;
}

.split-button > button:first-child {
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
}

.split-button > button:last-child {
  border-top-left-radius: 0;
  border-bottom-left-radius: 0;
  border-left-width: 0;
  min-width: 18px;
  padding: 2px 3px;
}

label.check {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}

input[type="checkbox"] {
  width: 13px;
  height: 13px;
  margin: 0;
  accent-color: var(--button-primary-bg);
  cursor: pointer;
}

input[type="text"],
input[type="search"],
textarea,
select {
  border: 1px solid var(--input-border);
  border-radius: var(--radius);
  background: var(--input-bg);
  color: var(--fg);
  font: inherit;
  padding: 3px 6px;
}

textarea {
  resize: none;
  font-family: var(--ui-font);
}

.search-field {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 22px;
  padding: 0 6px;
  border: 1px solid var(--input-border);
  border-radius: var(--radius);
  background: var(--input-bg);
}

.search-field input {
  border: 0;
  padding: 2px 0;
  background: transparent;
  min-width: 90px;
}

.search-field input:focus {
  outline: none;
}

/* ------------------------------------------------------------------- tabs */

.tabs {
  display: flex;
  flex: 0 0 auto;
  align-items: stretch;
  gap: 1px;
  padding: 0 4px;
  border-bottom: 1px solid var(--border-soft);
  background: var(--chrome-bg);
  overflow-x: auto;
}

.tabs button {
  border-radius: 0;
  border-bottom: 2px solid transparent;
  padding: 5px 10px;
  color: var(--fg-secondary);
}

.tabs button[aria-selected="true"] {
  border-bottom-color: var(--button-primary-bg);
  color: var(--fg);
  font-weight: 600;
}

/* ---------------------------------------------------------------- surfaces */

.surface {
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
  background: var(--panel-bg);
}

.column {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.row {
  display: flex;
  min-width: 0;
  min-height: 0;
}

.scroll {
  overflow: auto;
  min-height: 0;
}

.pane {
  position: relative;
  min-width: 0;
  min-height: 0;
}

.pane-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-bottom: 1px solid var(--border-soft);
  background: var(--chrome-bg);
  color: var(--fg-secondary);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.pane-header .toolbar-spacer {
  flex: 1 1 auto;
}

.divider-v {
  flex: 0 0 auto;
  width: 1px;
  background: var(--border-soft);
}

.divider-v.draggable {
  width: 5px;
  margin: 0 -2px;
  z-index: 3;
  background: transparent;
  cursor: col-resize;
}

.divider-v.draggable:hover,
.divider-v.draggable.active {
  background: var(--button-primary-bg);
}

.divider-h {
  flex: 0 0 auto;
  height: 1px;
  background: var(--border-soft);
}

.empty-state {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 24px;
  color: var(--fg-muted);
  text-align: center;
}

.empty-state .headline {
  color: var(--fg-secondary);
  font-size: 13px;
  font-weight: 600;
}

.empty-state code {
  font-family: var(--mono-font);
  font-size: 11px;
}

/* ------------------------------------------------------------------- lists */

.list {
  padding: 2px 0;
}

.group-header {
  display: flex;
  position: sticky;
  top: 0;
  z-index: 1;
  align-items: center;
  gap: 5px;
  height: var(--row-h);
  padding: 0 6px;
  background: var(--chrome-bg);
  cursor: pointer;
  user-select: none;
  font-weight: 600;
}

.group-header:hover {
  background: var(--hover);
}

.group-header .count {
  color: var(--fg-muted);
  font-weight: 400;
}

.disclosure {
  display: inline-flex;
  width: 10px;
  justify-content: center;
  color: var(--fg-secondary);
  transform-origin: center;
  transition: transform 120ms ease;
}

.disclosure[data-open="true"] {
  transform: rotate(90deg);
}

.tree-row {
  display: flex;
  align-items: center;
  gap: 6px;
  height: var(--row-h);
  padding: 0 6px 0 2px;
  cursor: default;
  user-select: none;
  white-space: nowrap;
}

.tree-row:hover {
  background: var(--hover);
}

.tree-row[aria-selected="true"] {
  background: var(--selection);
  color: #ffffff;
}

.tree-row[aria-selected="true"] .meta,
.tree-row[aria-selected="true"] .path,
.tree-row[aria-selected="true"] .badge {
  color: color-mix(in oklab, #ffffff 82%, transparent);
}

.tree-row .indent {
  display: inline-block;
  flex: 0 0 auto;
}

.tree-row .name {
  overflow: hidden;
  text-overflow: ellipsis;
}

.tree-row .path {
  color: var(--fg-secondary);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tree-row .meta {
  margin-left: auto;
  padding-left: 8px;
  color: var(--fg-muted);
  font-size: 11px;
}

.tree-row .grow {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-cell {
  display: inline-block;
  flex: 0 0 auto;
  width: 12px;
  font-family: var(--mono-font);
  font-size: 11px;
  font-weight: 700;
  text-align: center;
}

.badge {
  flex: 0 0 auto;
  padding: 0 5px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--fg-secondary);
  font-size: 10px;
  line-height: 15px;
}

.badge.head {
  border-color: var(--graph-head);
  color: var(--graph-head);
}

.badge.local {
  border-color: var(--graph-local);
  color: var(--graph-local);
}

.badge.remote {
  border-color: var(--graph-remote);
  color: var(--graph-remote);
}

.badge.tag {
  border-color: var(--graph-tag);
  color: var(--fg-secondary);
}

.tiny-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  padding: 0;
  border-radius: 3px;
  color: var(--fg-secondary);
  font-size: 13px;
  line-height: 1;
}

.tiny-button:hover {
  background: color-mix(in oklab, var(--fg) 14%, transparent);
}

/* -------------------------------------------------------------------- diff */

.diff {
  flex: 1 1 auto;
  overflow: auto;
  min-height: 0;
  background: var(--panel-bg);
}

.diff-file-header {
  display: flex;
  position: sticky;
  top: 0;
  z-index: 2;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 8px;
  border-bottom: 1px solid var(--border-soft);
  background: var(--panel-alt);
  color: var(--fg-secondary);
  font-size: 11px;
}

.diff-hunk-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 1px 6px;
  border-top: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
  background: var(--chrome-bg);
  color: var(--fg-secondary);
  font-family: var(--mono-font);
  font-size: 11px;
}

.diff-hunk-header.folded {
  background: var(--panel-alt);
}

.diff-hunk-note {
  color: var(--fg-muted);
}

.diff-hunk-actions {
  display: flex;
  gap: 3px;
  margin-left: auto;
  opacity: 0;
}

.diff-hunk-header:hover .diff-hunk-actions,
.diff-hunk-header:focus-within .diff-hunk-actions {
  opacity: 1;
}

.diff-hunk-actions button {
  min-height: 17px;
  padding: 0 6px;
  border-color: var(--button-border);
  background: var(--button-bg);
  font-family: var(--ui-font);
  font-size: 11px;
}

.diff-line {
  display: flex;
  min-height: 17px;
  font-family: var(--mono-font);
  font-size: var(--mono-size);
  line-height: 17px;
  white-space: pre;
}

.diff-line .gutter-mark {
  flex: 0 0 auto;
  width: 4px;
}

.diff-line .sign {
  flex: 0 0 auto;
  width: 12px;
  text-align: center;
  color: color-mix(in oklab, var(--fg) 55%, transparent);
  user-select: none;
}

.diff-line .text {
  flex: 1 1 auto;
  padding-right: 8px;
  min-width: 0;
}

.diff-line.inserted {
  background: var(--diff-inserted);
}

.diff-line.deleted {
  background: var(--diff-deleted);
}

.diff-line.modified {
  background: var(--diff-modified);
}

.diff-line.context .text {
  color: var(--fg);
}

/* Word-level highlight inside a changed line. The hue follows the row it sits
   on when a theme provides one: a blue patch over a red row reads as mud, which
   is exactly what the dark palette suffered from. */
.diff-line .fragment {
  border-radius: 2px;
  background: var(--diff-fragment);
}

.diff-line.deleted .fragment {
  background: var(--diff-fragment-deleted, var(--diff-fragment));
}

.diff-line.inserted .fragment {
  background: var(--diff-fragment-inserted, var(--diff-fragment));
}

.diff-line .fragment.strong {
  background: color-mix(in oklab, var(--diff-fragment) 60%, var(--button-primary-bg));
}

.whitespace-mark {
  color: color-mix(in oklab, var(--fg) 45%, transparent);
}

.diff-collapsed {
  padding: 0 8px 0 16px;
  border-top: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
  background: var(--panel-alt);
  color: var(--fg-muted);
  font-family: var(--mono-font);
  font-size: 11px;
  line-height: 18px;
  cursor: pointer;
}

.diff-collapsed:hover {
  color: var(--fg-secondary);
}

/* Side-by-side rendering of the very same hunks. */
/*
 * Side by side keeps each panel at half the viewport but never wraps: a
 * wrapped line breaks the row-by-row alignment that makes the two panels worth
 * comparing. When the content is wider than the panel the whole grid grows and
 * the diff scrolls horizontally as one, so both sides stay on the same offset.
 */
.diff-sbs {
  display: grid;
  grid-template-columns: minmax(50%, max-content) 2px minmax(50%, max-content);
  align-items: start;
  width: max-content;
  min-width: 100%;
}

.diff-sbs .side {
  min-width: 0;
  overflow: hidden;
}

.diff-sbs .spacer {
  background: var(--diff-divider);
}

.diff-sbs .diff-line .text {
  white-space: pre;
}

.diff-sbs .filler {
  background: var(--panel-alt);
}

/* --------------------------------------------------------------- messages */

.banner {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-left-width: 3px;
  border-radius: var(--radius);
  background: var(--panel-alt);
}

.banner.error {
  border-left-color: var(--status-conflict);
}

.banner.info {
  border-left-color: var(--button-primary-bg);
}

.banner .banner-text {
  min-width: 0;
}

.banner .banner-detail {
  margin-top: 4px;
  color: var(--fg-secondary);
  font-family: var(--mono-font);
  font-size: 11px;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ------------------------------------------------------- commit message area */

.commit-area {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 6px 8px 8px;
  border-top: 1px solid var(--border-soft);
  background: var(--chrome-bg);
}

.commit-message-row {
  display: flex;
  align-items: stretch;
  gap: 6px;
}

.commit-message-row textarea {
  flex: 1 1 auto;
  min-height: 62px;
  font-size: 13px;
  line-height: 1.5;
}

.commit-history {
  display: flex;
  flex: 0 0 auto;
  align-items: flex-start;
}

.commit-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.commit-actions .spacer {
  flex: 1 1 auto;
}

.commit-summary {
  color: var(--fg-secondary);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.commit-summary.warn {
  color: var(--status-unversioned);
}

/* ------------------------------------------------------------------ popups */

.popup {
  position: fixed;
  z-index: 40;
  min-width: 180px;
  max-width: min(520px, 92vw);
  max-height: 60vh;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel-bg);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.32);
  padding: 4px;
}

.popup .popup-title {
  padding: 4px 8px;
  color: var(--fg-muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.popup button {
  display: flex;
  width: 100%;
  justify-content: flex-start;
  gap: 7px;
  padding: 4px 8px;
  border-radius: 3px;
  text-align: left;
}

.popup button .shortcut {
  margin-left: auto;
  padding-left: 16px;
  color: var(--fg-muted);
  font-size: 11px;
}

.popup button[data-checked="true"]::before {
  content: "✓";
  width: 10px;
}

.popup button:not([data-checked])::before {
  content: "";
  width: 10px;
}

.popup .popup-separator {
  height: 1px;
  margin: 4px 2px;
  background: var(--border-soft);
}

.popup input[type="text"] {
  width: 100%;
  margin: 3px 0;
}

/* ------------------------------------------------------------------- graph */

.log-row {
  display: grid;
  grid-template-columns: var(--graph-width, 84px) minmax(0, 1fr);
  align-items: stretch;
  min-height: 34px;
  border-bottom: 1px solid color-mix(in oklab, var(--border-soft) 55%, transparent);
  cursor: default;
  user-select: none;
}

.log-row:hover {
  background: var(--hover);
}

.log-row[aria-selected="true"] {
  background: var(--selection);
  color: #ffffff;
}

.log-row[aria-selected="true"] .log-author,
.log-row[aria-selected="true"] .log-hash,
.log-row[aria-selected="true"] .log-date {
  color: color-mix(in oklab, #ffffff 78%, transparent);
}

.log-row.mine .log-subject {
  font-weight: 700;
}

.log-row.current-branch {
  background: color-mix(in oklab, var(--button-primary-bg) 10%, transparent);
}

.log-row.current-branch[aria-selected="true"] {
  background: var(--selection);
}

.log-graph {
  overflow: hidden;
}

.log-body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1px;
  padding: 3px 8px 3px 0;
  min-width: 0;
}

.log-subject {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.log-meta-line {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--fg-secondary);
  font-size: 11px;
  overflow: hidden;
}

.log-author,
.log-date,
.log-hash {
  color: var(--fg-muted);
  white-space: nowrap;
}

.log-hash {
  font-family: var(--mono-font);
}

.commit-details {
  padding: 8px 10px;
  color: var(--fg-secondary);
  font-size: 11px;
}

.commit-details dl {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 3px 10px;
  margin: 0;
}

.commit-details dt {
  color: var(--fg-muted);
}

.commit-details dd {
  margin: 0;
  overflow-wrap: anywhere;
  color: var(--fg);
}

.commit-details .message-body {
  margin-top: 8px;
  white-space: pre-wrap;
  color: var(--fg);
  font-family: var(--mono-font);
  font-size: 11px;
}

/* ----------------------------------------------------------------- console */

.console {
  flex: 1 1 auto;
  overflow: auto;
  min-height: 0;
  padding: 6px 8px;
  background: var(--panel-bg);
  font-family: var(--mono-font);
  font-size: 11px;
  line-height: 1.55;
}

.console-entry {
  margin-bottom: 10px;
}

.console-cmd {
  color: var(--status-modified);
  font-weight: 700;
  white-space: pre-wrap;
  word-break: break-word;
}

.console-out {
  margin: 2px 0 0;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--fg);
}

.console-out.failure {
  color: var(--status-conflict);
}

.console-time {
  color: var(--fg-muted);
}

/* ------------------------------------------------------------------- toast */

.toast-layer {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
}

.toast {
  max-width: 340px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-left-width: 3px;
  border-radius: 5px;
  background: var(--panel-bg);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  animation: toast-in 140ms ease-out;
}

.toast.error {
  border-left-color: var(--status-conflict);
}

.toast.info {
  border-left-color: var(--button-primary-bg);
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ------------------------------------------------------------ diff overlay */

/*
 * A commit's diff has no editor tab to live in, so it takes over the tool
 * window. It has to look like a deliberate surface rather than an unstyled
 * page: a header that names the file, a hairline under it, and the diff
 * inset on the panel background.
 */
.diff-overlay {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  background: var(--panel-bg);
}

.diff-overlay-header {
  gap: 6px;
  padding: 5px 6px;
  border-bottom: 1px solid var(--border-soft);
  background: var(--chrome-bg);
}

.diff-overlay-title {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.diff-overlay-path {
  color: var(--fg-muted);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.diff-overlay > .diff {
  padding-bottom: 12px;
}

/* The file header is the overlay's own headline; keep it flush, not sticky
   over the scrolling content it duplicates. */
.diff-overlay .diff-file-header {
  position: static;
  height: 26px;
  background: var(--panel-alt);
  font-size: 11px;
}

.diff-overlay .diff-hunk-header {
  font-size: 11px;
}

/* Two number columns in unified view (old | new), one per side otherwise. */
.diff-line .num {
  flex: 0 0 auto;
  width: 30px;
  padding-right: 6px;
  color: var(--fg-muted);
  text-align: right;
  user-select: none;
}

.diff-sbs .diff-line .num {
  width: 34px;
}

/* ---- src/layout.css ---- */
/*
 * Layout on top of the palette: scrollbars, resizers, the Log tab's pane grid
 * and the affordances that only exist once the panel gets narrow.
 */

::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  border: 2px solid transparent;
  border-radius: 6px;
  background: color-mix(in oklab, var(--fg) 22%, transparent);
  background-clip: content-box;
}

::-webkit-scrollbar-thumb:hover {
  background: color-mix(in oklab, var(--fg) 38%, transparent);
  background-clip: content-box;
}

::-webkit-scrollbar-corner {
  background: transparent;
}

/* ------------------------------------------------------------------- panes */

/* A vertical splitter that is only visible while hovered or dragged, so the
   surface keeps IDEA's flat look at rest. */
.splitter-y {
  flex: 0 0 auto;
  height: 5px;
  margin: -2px 0;
  z-index: 4;
  background: transparent;
  cursor: row-resize;
}

.splitter-y:hover,
.splitter-y.active {
  background: var(--button-primary-bg);
}

.log-panes {
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
}

.log-panes > .branches-pane {
  flex: 0 0 auto;
  width: var(--branches-width, 168px);
}

.log-panes > .commits-pane {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.log-detail {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;
  min-height: 0;
  height: var(--detail-height, 46%);
}

.log-detail > .changed-files {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
}

.log-detail > .details-pane {
  flex: 0 0 auto;
  max-height: 45%;
  overflow: auto;
  border-top: 1px solid var(--border-soft);
}

/* Keep the commit list readable when the pane is narrow: the meta line wraps
   away before the subject does. */
@media (max-width: 560px) {
  /* Wrap the author/date/hash line instead of clipping it. */
  .log-meta-line {
    flex-wrap: wrap;
    gap: 4px 8px;

    width: 128px;
  }
}

.commit-view {
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
}

.commit-changes {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;

}

.commit-diff {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-width: 0;

   * that differs only in whitespace can be labelled as such.

  function pairChanges(hunk) {
    const lines = hunk.lines;
    let index = 0;
    while (index < lines.length) {

      while (index < lines.length && lines[index].type === "delete") deletes.push(lines[index++]);
      const inserts = [];
      while (index < lines.length && lines[index].type === "insert") inserts.push(lines[index++]);
      const pairs = Math.min(deletes.length, inserts.length);
      for (let offset = 0; offset < pairs; offset += 1) {
        const left = deletes[offset];
        const right = inserts[offset];
        const edges = commonEdges(left.text, right.text);

 * A submodule change is two bare object names ("Subproject commit <sha>").
 * Git renders it as an ordinary two-line diff, which reads as noise; naming it
 * as a submodule update makes those same two lines meaningful.

    const toolbar = h("div", { class: "toolbar" });
    const changesList = h("div", { class: "scroll list" });
    const diffHost = h("div", { class: "diff" });
    const diffHeader = h("div", { class: "pane-header" });
    const messageInput = h("textarea", {
      placeholder: t("commitMessage"),
      spellcheck: "false",
      oninput: (event) => { state.message = event.target.value; paintCommit(); },
    });
    const amendBox = h("input", { type: "checkbox", onchange: (event) => { state.amend = event.target.checked; paintCommit(); } });
    const signoffBox = h("input", { type: "checkbox", onchange: (event) => { state.signoff = event.target.checked; } });
    const summary = h("span", { class: "commit-summary" });
    const commitButton = h("button", { class: "primary", type: "button", text: t("commit"), onclick: () => commit(false) });
    // A bordered (not primary) menu half keeps the split button readable while
    // the Commit half is disabled for a missing message.
    const commitMenuButton = h("button", { class: "bordered icon", type: "button", "aria-label": t("commitAndPush"), title: t("commitAndPush"), onclick: openCommitMenu }, [icon("chevronDown", 13)]);
    const changesHeader = h("div", { class: "pane-header" });

    const changesWidth = h("div", { class: "commit-changes column" });
    const diffColumn = h("div", { class: "commit-diff column" });
    const divider = h("div", { class: "divider-v draggable", title: "" });

    let branchWidget = null;

    // --------------------------------------------------------- rendering --
    function paintToolbar() {
      PIG.clear(toolbar);
      toolbar.append(branchHolder);
      toolbar.append(h("div", { class: "toolbar-separator" }));
      toolbar.append(iconButton("refresh", tip("refresh", KEYS.refresh), () => refresh()));
      toolbar.append(iconButton("fetch", t("fetch"), async () => {
        const result = await invoke("git/fetch");
        if (report(result, t("fetch"))) await refresh();
      }));
      toolbar.append(iconButton("push", t("push"), async () => {
        const branch = state.repo?.branch;
        const result = await invoke("git/push", {
          remote: "origin",
          branch: branch?.head,
          setUpstream: !branch?.upstream,
        });
        report(result, t("push"));
      }));
      toolbar.append(h("div", { class: "toolbar-separator" }));
      toolbar.append(iconButton("plus", tip("stageFile", KEYS.stage), () => stageSelected(true), { disabled: !canStageSelected() }));
      toolbar.append(iconButton("minus", t("unstageFile"), () => stageSelected(false), { disabled: !canUnstageSelected() }));
      toolbar.append(iconButton("rollback", tip("rollback", KEYS.rollback), rollbackSelected, { disabled: !state.selection }));
      toolbar.append(h("div", { class: "toolbar-spacer" }));
      toolbar.append(h("span", { style: { fontSize: "11px", color: "var(--fg-muted)" }, text: state.repo?.repo?.name ?? "" }));
    }

    function paintChangesHeader() {
      PIG.clear(changesHeader);
      const counts = state.repo
        ? { staged: state.repo.staged.length, unstaged: state.repo.unstaged.length, untracked: state.repo.untracked.length, conflicted: state.repo.conflicted.length }
        : { staged: 0, unstaged: 0, untracked: 0, conflicted: 0 };
      const total = counts.staged + counts.unstaged + counts.untracked + counts.conflicted;
      changesHeader.append(h("span", { text: t("changes") }));
      changesHeader.append(h("span", { class: "muted", text: total ? `${total}` : "" }));
      changesHeader.append(h("div", { class: "toolbar-spacer" }));
      changesHeader.append(iconButton("minus", t("unstageAllChanges"), async () => {
        const paths = (state.repo?.staged ?? []).map((file) => file.path);
        if (!paths.length) return;
        report(await invoke("git/unstage", { paths }), t("unstageAllChanges"));
        await refresh();
      }, { size: 13 }));
      changesHeader.append(iconButton("plus", t("stageAllChanges"), async () => {
        const paths = [
          ...(state.repo?.unstaged ?? []).map((file) => file.path),
          ...(state.repo?.untracked ?? []).map((file) => file.path),
        ];
        if (!paths.length) return;
        report(await invoke("git/stage", { paths }), t("stageAllChanges"));
        await refresh();
      }, { size: 13 }));
    }

    function fileRow(group, file) {
      const selectionKey = `${group}:${file.path}`;
      const selected = state.selection === selectionKey;
      const { name, directory } = splitPath(file.path);

      const checkbox = h("input", {
        type: "checkbox",
        title: t("includeIntoCommit"),
        checked: group === "staged",
        onclick: (event) => event.stopPropagation(),
        onchange: async (event) => {
          const checked = event.target.checked;
          event.target.disabled = true;
          const channel = checked ? "git/stage" : "git/unstage";
          const result = await invoke(channel, { paths: [file.path] });
          if (!result.ok) toast(result.message, "error");
          await refresh();
        },
      });

      const row = h("div", {
        class: "tree-row",
        role: "option",
        tabindex: "0",
        "aria-selected": selected ? "true" : "false",
        title: file.path,
        onclick: () => select(selectionKey),
        oncontextmenu: (event) => {
          event.preventDefault();
          select(selectionKey);
          fileContextMenu(event.currentTarget, group, file);
        },
      }, [
        h("span", { class: "indent", style: { width: "14px" } }),
        checkbox,
        h("span", { class: "status-cell", style: { color: statusColor(file.status) }, text: file.status === "?" ? "?" : file.status }),
        h("span", { class: "name", style: { color: statusColor(file.status) }, text: name }),
        directory ? h("span", { class: "path", text: directory }) : null,
      ]);
      return row;
    }

    function paintChanges() {
      PIG.clear(changesList);
      if (!state.repo) {
        changesList.append(h("div", { class: "empty-state" }, [
          h("div", { class: "headline", text: state.error ? t("notARepository") : t("loading") }),
          state.error ? h("code", { text: state.error }) : null,
          state.error ? h("div", { class: "muted", text: t("repositoryHint") }) : null,
        ]));
        return;
      }

      const filter = state.filter.trim().toLowerCase();
      let shown = 0;

      for (const group of GROUPS) {
        const files = (state.repo[group.id] ?? []).filter((file) =>
          !filter || file.path.toLowerCase().includes(filter));
        if (!files.length) continue;
        shown += files.length;
        const open = !state.collapsed.has(group.id);
        const header = h("div", {
          class: "group-header",
          onclick: () => {
            if (state.collapsed.has(group.id)) state.collapsed.delete(group.id);
            else state.collapsed.add(group.id);
            paintChanges();
          },
        }, [
          h("span", { class: "disclosure", "data-open": open ? "true" : "false" }, [icon("chevronRight", 11)]),
          h("span", { text: t(group.label) }),
          h("span", { class: "count", text: `${files.length}` }),
        ]);
        if (group.id === "staged" || group.id === "unstaged" || group.id === "untracked") {
          header.append(h("div", { class: "toolbar-spacer" }));
          const allStaged = group.id === "staged";
          header.append(h("button", {
            class: "tiny-button",
            type: "button",
            title: allStaged ? t("unstageAllChanges") : t("stageAllChanges"),
            onclick: async (event) => {
              event.stopPropagation();
              const paths = files.map((file) => file.path);
              const result = await invoke(allStaged ? "git/unstage" : "git/stage", { paths });
              if (!result.ok) toast(result.message, "error");
              await refresh();
            },
          }, [icon(allStaged ? "minus" : "plus", 11)]));
        }
        changesList.append(header);
        if (!open) continue;
        for (const file of files) changesList.append(fileRow(group.id, file));
      }

      if (!shown) {
        changesList.append(h("div", { class: "empty-state" }, [
          h("div", { class: "headline", text: t("noChanges") }),
        ]));
      }
    }

    function paintDiffHeader() {
      PIG.clear(diffHeader);
      if (!state.selection || !state.diff) {
        diffHeader.append(h("span", { class: "muted", text: t("pickFile") }));
        return;
      }
      const [, path] = state.selection.split(":");
      const { name, directory } = splitPath(path);
      diffHeader.append(h("span", { text: name }));
      if (directory) diffHeader.append(h("span", { class: "muted", text: directory }));
      diffHeader.append(h("div", { class: "toolbar-spacer" }));
      diffHeader.append(iconButton("columns", t("sideBySide") + " / " + t("unified"), () => {
        state.diffUnified = !state.diffUnified;
        paintDiff();
        savePrefs();
      }, { size: 13, class: "icon" }));
      diffHeader.append(iconButton("eye", t("showWhitespaces"), () => {
        state.showWhitespaces = !state.showWhitespaces;
        paintDiff();
      }, { size: 13 }));
      diffHeader.append(iconButton("gear", t("ignoreDifferences"), (event) => {
        popup(event.currentTarget, [
          { type: "label", label: t("ignoreDifferences") },
          { label: t("ignoreNone"), checked: !state.ignoreWhitespace, onSelect: () => setIgnoreWhitespace(false) },
          { label: t("ignoreWhitespace"), checked: state.ignoreWhitespace, onSelect: () => setIgnoreWhitespace(true) },
          { type: "separator" },
          { label: t("showLineNumbers"), checked: state.showLineNumbers, onSelect: () => { state.showLineNumbers = !state.showLineNumbers; paintDiff(); } },
        ]);
      }, { size: 13 }));
    }

    function hunkActionsFor(selection, file) {
      const group = selection.split(":")[0];
      const isIndex = group === "staged";
      if (group === "untracked") return [];
      if (state.ignoreWhitespace) return [];
      if (isIndex) {
        return [{
          label: t("unstageHunk"),
          title: t("unstageHunk"),
          onSelect: async (hunk) => {
            const patch = PIG.diff.patchFor({ header: currentHeader(), hunks: [hunk] }, [hunk]);
            report(await invoke("git/apply-patch", { action: "unstage", patch }), t("unstageHunk"));
            await refresh();
          },
        }];
      }
      return [
        {
          label: t("stageHunk"),
          title: t("stageHunk"),
          onSelect: async (hunk) => {
            const patch = PIG.diff.patchFor({ header: currentHeader(), hunks: [hunk] }, [hunk]);
            report(await invoke("git/apply-patch", { action: "stage", patch }), t("stageHunk"));
            await refresh();
          },
        },
        {
          label: t("discardHunk"),
          title: t("discardHunk"),
          onSelect: async (hunk) => {
            const confirmed = await dialog({
              title: t("discardHunk"),
              message: t("discard"),
              danger: true,
              confirmLabel: t("discard"),
            });
            if (!confirmed) return;
            const patch = PIG.diff.patchFor({ header: currentHeader(), hunks: [hunk] }, [hunk]);
            report(await invoke("git/apply-patch", { action: "discard", patch }), t("discardHunk"));
            await refresh();
          },
        },
      ];
    }

    function currentHeader() {
      return state.diff?.parsed?.files?.[0]?.header ?? ["diff --git a/x b/x"];
    }

    function paintDiff() {
      paintDiffHeader();
      const group = state.selection ? state.selection.split(":")[0] : null;
      const stageable = group !== "untracked" && !state.ignoreWhitespace;
      const result = PIG.diff.render(diffHost, {
        text: state.diff?.text ?? "",
        unified: state.diffUnified,
        showWhitespaces: state.showWhitespaces,
        showLineNumbers: state.showLineNumbers,
        stageable,
        hunkActions: state.selection ? hunkActionsFor(state.selection) : [],
        hunkCheckbox: state.selection && group !== "untracked" && !state.ignoreWhitespace
          ? (hunk) => ({
            checked: group === "staged",
            onChange: async (checked) => {
              const isIndex = group === "staged";
              if (checked === isIndex) return;
              const patch = PIG.diff.patchFor({ header: currentHeader(), hunks: [hunk] }, [hunk]);
              report(await invoke("git/apply-patch", { action: checked ? "stage" : "unstage", patch }), t("includeIntoCommit"));
              await refresh();
            },
          })
          : null,
        emptyMessage: state.diff?.binary ? t("binaryDiff") : t("noDiff"),
      });
      // `state.diff` is null while nothing is selected, so the parsed model is
      // only stored back when there really is a diff to attach it to.
      if (state.diff) state.diff.parsed = result;
    }

    function paintCommit() {
      commitButton.disabled = state.busy || (!state.message.trim() && !state.amend);
      const staged = state.repo?.staged?.length ?? 0;
      const total = staged
        + (state.repo?.unstaged?.length ?? 0)
        + (state.repo?.untracked?.length ?? 0)
        + (state.repo?.conflicted?.length ?? 0);
      const conflicts = state.repo?.conflicted?.length ?? 0;
      PIG.clear(summary);
      if (conflicts) {
        summary.className = "commit-summary warn";
        summary.append(t("conflictNotice"));
      } else if (!staged && !state.amend) {
        summary.className = "commit-summary warn";
        summary.append(t("nothingStaged"));
      } else {
        summary.className = "commit-summary";
        summary.append(PIG.state.locale === "zh-CN"
          ? `将提交 ${staged} / ${total} 个文件`
          : `${staged} of ${total} file${total === 1 ? "" : "s"} will be committed`);
      }
    }

    /**
     * One failing pane must never blank the others — that is exactly how the
     * missing `state.diff` guard used to take the branch widget down with it.
     */
    let reportedFailure = false;
    function paintAll() {
      for (const step of [paintToolbar, paintChangesHeader, paintChanges, paintDiff, paintCommit]) {
        try {
          step();
        } catch (error) {
          if (!reportedFailure) {
            reportedFailure = true;
            toast(`IDEA Git: ${error?.message ?? error}`, "error");
          }
        }
      }
      try {
        branchWidget?.update(state.repo);
      } catch {
        // The chip is decoration; never let it break the refresh.
      }
    }

    // ----------------------------------------------------------- actions --
    function select(selectionKey) {
      state.selection = selectionKey;
      loadDiff().catch((error) => toast(String(error?.message ?? error), "error"));
      paintChanges();
    }

    function canStageSelected() {
      return Boolean(state.selection && state.selection.split(":")[0] !== "staged");
    }

    function canUnstageSelected() {
      return Boolean(state.selection && state.selection.split(":")[0] === "staged");
    }

    function selectedPath() {
      return state.selection ? state.selection.split(":").slice(1).join(":") : null;
    }

    async function stageSelected(staging) {
      const path = selectedPath();
      if (!path) return;
      report(await invoke(staging ? "git/stage" : "git/unstage", { paths: [path] }), staging ? t("stageFile") : t("unstageFile"));
      await refresh();
    }

    async function rollbackSelected() {
      const path = selectedPath();
      if (!path) return;
      const confirmed = await dialog({
        title: t("rollback"),
        message: `${t("rollback")} ${path}?`,
        detail: t("discard"),
        danger: true,
        confirmLabel: t("rollback"),
      });
      if (!confirmed) return;
      report(await invoke("git/discard", { paths: [path] }), t("rollback"));
      await refresh();
    }

    function fileContextMenu(anchor, group, file) {
      const items = [
        { label: t("showDiff"), onSelect: () => select(`${group}:${file.path}`) },
        { type: "separator" },
      ];
      if (group === "staged") {
        items.push({ label: t("unstageFile"), onSelect: () => stageFile(group, file, false) });
      } else {
        items.push({ label: t("stageFile"), onSelect: () => stageFile(group, file, true) });
      }
      items.push({
        label: t("rollback"),
        disabled: group === "staged",
        onSelect: async () => {
          const confirmed = await dialog({
            title: t("rollback"),
            message: `${t("rollback")} ${file.path}?`,
            danger: true,
            confirmLabel: t("rollback"),
          });
          if (!confirmed) return;
          report(await invoke("git/discard", { paths: [file.path] }), t("rollback"));
          await refresh();
        },
      });
      const relative = workspaceRelative(file.path, state.repo);
      items.push({ type: "separator" });
      items.push({
        label: t("openFile"),
        disabled: !relative,
        title: relative ? file.path : `${t("openFile")} — ${file.path}`,
        onSelect: () => invoke("fs.openDefault", { path: relative }),
      });
      items.push({
        label: t("revealInFileManager"),
        disabled: !relative,
        onSelect: () => invoke("fs.reveal", { path: relative }),
      });
      items.push({ label: t("copy") + " " + t("hash"), onSelect: () => PIG.copyText(file.path) });
      popup(anchor, items);
    }

    async function stageFile(group, file, staging) {
      report(await invoke(staging ? "git/stage" : "git/unstage", { paths: [file.path] }), staging ? t("stageFile") : t("unstageFile"));
      await refresh();
    }

    async function loadDiff() {
      if (!state.selection) {
        state.diff = null;
        paintDiff();
        return;
      }
      const [group, ...rest] = state.selection.split(":");
      const path = rest.join(":");
      const mode = group === "staged" ? "index" : "worktree";
      const result = await invoke("git/diff", {
        path,
        mode,
        ignoreWhitespace: state.ignoreWhitespace,
      });
      if (!result.ok) {
        state.diff = { text: "", error: result.message };
        paintDiff();
        diffHost.append(h("div", { class: "banner error" }, [
          h("div", { class: "banner-text" }, [
            h("div", { text: result.message ?? "Diff failed" }),
          ]),
        ]));
        return;
      }
      state.diff = result;
      paintDiff();
    }

    function setIgnoreWhitespace(enabled) {
      state.ignoreWhitespace = enabled;
      savePrefs();
      loadDiff().catch(() => {});
    }

    function openCommitMenu(event) {
      popup(event.currentTarget, [
        { label: t("commit"), onSelect: () => commit(false) },
        { label: t("commitAndPush"), onSelect: () => commit(true) },
        { type: "separator" },
        { label: t("amend"), checked: state.amend, onSelect: () => { state.amend = !state.amend; amendBox.checked = state.amend; paintCommit(); } },
        { label: t("signOff"), checked: state.signoff, onSelect: () => { state.signoff = !state.signoff; signoffBox.checked = state.signoff; } },
        { type: "separator" },
        {
          label: t("rollback"),
          onSelect: async () => {
            const paths = (state.repo?.staged ?? []).map((file) => file.path);
            if (!paths.length) return;
            const confirmed = await dialog({
              title: t("rollback"),
              message: `${t("unstageFile")}?`,
              confirmLabel: t("rollback"),
            });
            if (!confirmed) return;
            report(await invoke("git/unstage", { paths }), t("unstageFile"));
            await refresh();
          },
        },
      ]);
    }

    async function commit(withPush) {
      if (state.busy) return;
      const message = state.message.trim();
      if (!message && !state.amend) {
        toast(t("commitMessage"), "error");
        messageInput.focus();
        return;
      }
      if (!state.amend && !(state.repo?.staged?.length ?? 0)) {
        toast(t("nothingStaged"), "error");
        return;
      }
      state.busy = true;
      paintCommit();
      const result = await invoke("git/commit", {
        message,
        amend: state.amend,
        signoff: state.signoff,
      });
      state.busy = false;
      if (!result.ok) {
        toast(result.message ?? t("commit"), "error");
        paintCommit();
        return;
      }
      if (message) {
        const remembered = await invoke("git/message-used", { message });
        state.messages = remembered.prefs?.messages ?? state.messages;
      }
      state.message = "";
      messageInput.value = "";
      state.amend = false;
      amendBox.checked = false;
      toast(firstLine(result.stdout) || t("commit"), "info");

      if (withPush) {
        const branch = state.repo?.branch;
        const pushed = await invoke("git/push", {
          remote: "origin",
          branch: branch?.head,
          setUpstream: !branch?.upstream,
        });
        report(pushed, t("push"));
      }
      await refresh();
    }

    function openMessageHistory(event) {
      if (!state.messages.length) {
        toast(t("commitHistory"), "info");
        return;
      }
      popup(event.currentTarget, [
        { type: "label", label: t("commitHistory") },
        ...state.messages.slice(0, 20).map((message) => ({
          label: firstLine(message).slice(0, 90),
          title: message,
          onSelect: () => {
            state.message = message;
            messageInput.value = message;
            paintCommit();
            messageInput.focus();
          },
        })),
        { type: "separator" },
        {
          label: t("clearAll"),
          onSelect: async () => {
            await invoke("git/prefs-set", { ui: { messagesCleared: Date.now() } });
            state.messages = [];
          },
        },
      ]);
    }

    // ------------------------------------------------------------- wiring --
    function savePrefs() {
      invoke("git/prefs-set", {
        ui: {
          commitUnified: state.diffUnified,
          showWhitespaces: state.showWhitespaces,
          showLineNumbers: state.showLineNumbers,
        },
      }).catch(() => {});
    }

    // -------------------------------------------------------------- shell --
    changesWidth.append(changesHeader, changesList);
    diffColumn.append(diffHeader, diffHost);
    root.append(toolbar);
    root.append(h("div", { class: "commit-view" }, [changesWidth, divider, diffColumn]));
    root.append(h("div", { class: "commit-area" }, [
      h("div", { class: "commit-message-row" }, [
        messageInput,
        h("div", { class: "commit-history" }, [
          iconButton("clock", t("commitHistory"), openMessageHistory, { size: 15 }),
        ]),
      ]),
      h("div", { class: "commit-actions" }, [
        h("label", { class: "check" }, [amendBox, t("amend")]),
        h("label", { class: "check" }, [signoffBox, t("signOff")]),
        summary,
        h("span", { class: "spacer" }),
        h("span", { class: "commit-summary", style: { maxWidth: "40%" }, id: "commit-branch" }),
        h("div", { class: "split-button" }, [commitButton, commitMenuButton]),
      ]),
    ]));

    branchWidget = mountBranchWidget(branchHolder, { onChanged: () => refresh() });

    PIG.bindSplitter(divider, (delta) => {
      const total = root.clientWidth || 1;
      state.changesWidth = Math.max(18, Math.min(75, state.changesWidth + (delta / total) * 100));
      changesWidth.style.width = `${state.changesWidth}%`;
    });

    // ------------------------------------------------------------- refresh --
    async function refresh() {
      const result = await invoke("git/repo");
      if (!result.ok) {
        state.repo = null;
        state.error = result.message ?? t("notARepository");
        paintAll();
        return;
      }
      state.repo = result;
      state.error = null;
      // Drop a selection whose file left the change lists.
      if (state.selection) {
        const [group, ...rest] = state.selection.split(":");
        const path = rest.join(":");
        const stillThere = (result[group] ?? []).some((file) => file.path === path);
        if (!stillThere) state.selection = null;
      }
      if (!state.selection) {
        const first = ["conflicted", "unstaged", "staged", "untracked"]
          .flatMap((group) => (result[group] ?? []).map((file) => `${group}:${file.path}`))[0];
        state.selection = first ?? null;
      }
      paintAll();
      await loadDiff();
    }

    async function loadPrefs() {
      const result = await invoke("git/prefs");
      if (!result.ok) return;
      state.messages = result.prefs?.messages ?? [];
      const ui = result.prefs?.ui ?? {};
      if (typeof ui.commitUnified === "boolean") state.diffUnified = ui.commitUnified;
      if (typeof ui.showWhitespaces === "boolean") state.showWhitespaces = ui.showWhitespaces;
      if (typeof ui.showLineNumbers === "boolean") state.showLineNumbers = ui.showLineNumbers;
    }

    (async () => {
      try {
        await loadPrefs();
        await refresh();
      } catch (error) {
        // Without this the view would fail silently on first paint.
        toast(`IDEA Git: ${error?.message ?? error}`, "error");
      }
    })();

    window.addEventListener("pig:appearance", () => paintAll());
    PIG.watchWorkspace(() => { refresh().catch(() => {}); });

    PIG.bindShortcuts([
      { spec: KEYS.refresh, run: () => { refresh().catch(() => {}); } },
      { spec: KEYS.refreshAlt, run: () => { refresh().catch(() => {}); } },

/**
 * The Git tool window — IDEA's `Alt+9` surface, holding the Log and Console
 * tabs. The Log keeps IDEA's panes: branches on the left, commits in the
 * centre, and the changed files plus commit details below the list.
 *
 * IDEA opens a commit's diff in the editor. There is no editor here, so the
 * diff opens in an overlay inside the tool window instead — the same content,
 * the same wording, one click away.
 */
(function (PIG) {
  "use strict";

  const { h, t, invoke, icon, iconButton, toast, popup, dialog } = PIG;

  /**
   * IDEA's Log shortcuts, in the form this surface can honour. The tooltip is
   * rendered from the same spec that is bound, so the two cannot drift apart.
   */
  const KEYS = {
    refresh: { key: "r", mod: true },
    refreshAlt: { key: "F5", ctrl: true },
    find: { key: "f", mod: true },
    showDiff: { key: "d", mod: true },
  };

  function tip(key, spec) {
    return `${t(key)} (${PIG.formatShortcut(spec)})`;
  }

  const ROW_HEIGHT = 34;
  const LANE_WIDTH = 14;
  const LANE_COLORS = ["#4a86c8", "#3fb28a", "#c9a227", "#b06bc0", "#d1743a", "#6aa84f", "#c05555", "#5f7fd4"];
  const SVG_NS = "http://www.w3.org/2000/svg";

  function svg(tag, attributes) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, String(value));
    return node;
  }

  /**
   * Assign each commit a lane. A commit takes the lane already reserved for it
   * (the one a child pushed down), otherwise a free lane; its first parent
   * inherits the lane and extra parents take their own.
   */
  function assignLanes(commits) {
    const lanes = [];
    const rows = [];
    for (const commit of commits) {
      const before = lanes.slice();
      let lane = lanes.indexOf(commit.hash);
      if (lane < 0) {
        lane = lanes.indexOf(null);
        if (lane < 0) {
          lane = lanes.length;
          lanes.push(null);
        }
      }
      lanes[lane] = null;
      const parents = commit.parents ?? [];
      if (parents.length) {
        lanes[lane] = parents[0];
        for (let index = 1; index < parents.length; index += 1) {
          if (lanes.includes(parents[index])) continue;
          const free = lanes.indexOf(null);
          if (free < 0) lanes.push(parents[index]);
          else lanes[free] = parents[index];
        }
      }
      while (lanes.length && lanes[lanes.length - 1] === null) lanes.pop();
      rows.push({ commit, lane, before, after: lanes.slice() });
    }
    const laneCount = rows.reduce(
      (max, row) => Math.max(max, row.before.length, row.after.length, row.lane + 1),
      1,
    );
    const rowByHash = new Map();
    rows.forEach((row, index) => rowByHash.set(row.commit.hash, { index, lane: row.lane }));
    return { rows, rowByHash, width: Math.max(56, laneCount * LANE_WIDTH + 14) };
  }

  /** IDEA colours the tip by what the commit *is*, not by lane. */
  function dotColor(commit, lane) {
    const refs = commit.refs ?? [];
    if (refs.some((ref) => ref.head)) return "var(--graph-head)";
    if (refs.some((ref) => ref.kind === "branch")) return "var(--graph-local)";
    if (refs.some((ref) => ref.kind === "remote")) return "var(--graph-remote)";
    if (refs.some((ref) => ref.kind === "tag")) return "var(--graph-tag)";
    return LANE_COLORS[lane % LANE_COLORS.length];
  }

  function graphNode(row, layout) {
    const { rowByHash } = layout;
    const group = svg("svg", { width: layout.width, height: ROW_HEIGHT, class: "log-graph-svg" });
    const x = (lane) => 10 + lane * LANE_WIDTH;
    const midY = ROW_HEIGHT / 2;

    const laneIndices = new Set([row.lane]);
    row.before.forEach((value, index) => { if (value) laneIndices.add(index); });
    row.after.forEach((value, index) => { if (value) laneIndices.add(index); });

    for (const lane of laneIndices) {
      const arrives = Boolean(row.before[lane]);
      const continues = Boolean(row.after[lane]);
      if (!arrives && !continues) continue;
      const top = arrives ? 0 : midY;
      const bottom = continues ? ROW_HEIGHT : midY;
      if (bottom <= top) continue;
      group.append(svg("line", {
        x1: x(lane), y1: top, x2: x(lane), y2: bottom,
        stroke: LANE_COLORS[lane % LANE_COLORS.length], "stroke-width": 1.6,
      }));
    }

    for (const parent of row.commit.parents ?? []) {
      const target = rowByHash.get(parent);
      if (!target) continue;
      if (target.lane === row.lane) {
        group.append(svg("line", {
          x1: x(row.lane), y1: midY, x2: x(row.lane), y2: ROW_HEIGHT,
          stroke: LANE_COLORS[row.lane % LANE_COLORS.length], "stroke-width": 1.6,
        }));
        continue;
      }
      group.append(svg("path", {
        d: `M ${x(row.lane)} ${midY} C ${x(row.lane)} ${midY + 9}, ${x(target.lane)} ${ROW_HEIGHT - 9}, ${x(target.lane)} ${ROW_HEIGHT}`,
        fill: "none",
        stroke: LANE_COLORS[target.lane % LANE_COLORS.length],
        "stroke-width": 1.6,
      }));
    }

    group.append(svg("circle", {
      cx: x(row.lane), cy: midY, r: 3.6,
      fill: dotColor(row.commit, row.lane),
      stroke: "var(--panel-bg)", "stroke-width": 1.2,

  }

  function refBadges(commit) {
    return (commit.refs ?? []).map((ref) => {

  /** Diff overlay: the stand-in for IDEA's "diff opens in the editor". */
  /**

   * controls, then the diff itself. It replaces the tool window's content
   * because there is no editor tab to open it into.

  function openDiffOverlay(title, text, repo) {
    const view = { unified: true, showWhitespaces: false, showLineNumbers: true };
    const body = h("div", { class: "diff" });
    const header = h("div", { class: "toolbar diff-overlay-header" });
    const overlay = h("div", { class: "diff-overlay", role: "dialog", "aria-label": title });

    const close = () => {
      overlay.remove();
      document.removeEventListener("keydown", onKey, true);
    };
    const onKey = (event) => {
      if (event.key === "Escape") {
        event.stopPropagation();
        close();
      }
    };

    function paintDiff() {
      PIG.diff.render(body, {
        text,
        unified: view.unified,
        showWhitespaces: view.showWhitespaces,
        showLineNumbers: view.showLineNumbers,
        showFileHeader: true,
        // A committed change is not something to stage or discard.
        stageable: false,
        hunkActions: [],
      });
    }

    function paintHeader() {
      PIG.clear(header);
      const { name, directory } = PIG.splitPath(title);
      header.append(icon("file", 14));
      header.append(h("span", { class: "diff-overlay-title", text: name }));
      if (directory) header.append(h("span", { class: "diff-overlay-path", text: directory }));
      header.append(h("div", { class: "toolbar-spacer" }));
      header.append(iconButton("columns", t("sideBySide") + " / " + t("unified"), () => {
        view.unified = !view.unified;
        paintDiff();
      }, { size: 14 }));
      header.append(iconButton("eye", t("showWhitespaces"), () => {
        view.showWhitespaces = !view.showWhitespaces;
        paintDiff();
      }, { size: 14 }));
      header.append(iconButton("list", t("showLineNumbers"), () => {
        view.showLineNumbers = !view.showLineNumbers;
        paintDiff();
      }, { size: 14 }));
      header.append(iconButton("close", `${t("close")} (Esc)`, close, { size: 14 }));
    }

    overlay.append(header, body);
    document.body.append(overlay);
    paintHeader();
    paintDiff();
    document.addEventListener("keydown", onKey, true);
  }

  function mountLog(root) {
    const state = {
      repo: null,
      commits: [],
      error: null,
      repoPath: null,
      branches: [],
      selection: null,
      changedFiles: [],
      details: null,
      search: "",
      branchFilter: "",
      pathFilter: "",
      showGraph: true,
      firstParent: false,
      noMerges: false,
      topo: false,
      showBranches: true,
      showDetails: true,

    };

    const toolbar = h("div", { class: "toolbar" });
    let searchButton = null;
    const branchHolder = h("div", { style: { display: "contents" } });
    const branchWidget = PIG.branchWidget.mount(branchHolder, { onChanged: () => refresh() });
    const listHost = h("div", { class: "scroll", style: { flex: "1 1 auto" } });
    const branchesHost = h("div", { class: "scroll" });
    const branchesPane = h("div", { class: "pane branches-pane column" });
    const changedHost = h("div", { class: "scroll list changed-files" });
    const detailsHost = h("div", { class: "commit-details details-pane" });
    const detailPane = h("div", { class: "log-detail" });

          { type: "separator" },

          { label: t("noMerges"), checked: state.noMerges, onSelect: () => { state.noMerges = !state.noMerges; loadLog(); } },
          { type: "separator" },
          { label: t("showGraph"), checked: state.showGraph, onSelect: () => { state.showGraph = !state.showGraph; paintList(); } },

        },
        {
          label: t("revert"),
          onSelect: async () => {
            const result = await invoke("git/revert", { hash: commit.hash });
            toast(result.ok ? `${t("revert")}: ${commit.short}` : result.message, result.ok ? "info" : "error");
            await refresh();
          },
        },
        {
          label: t("resetToHere"),
          onSelect: async () => {
            const mode = await dialog({
              title: t("resetToHere"),
              message: `${t("reset")} --mode ${commit.short}`,
              detail: `${t("soft")} | ${t("mixed")} | ${t("hard")}`,
              input: { value: "mixed" },
              confirmLabel: t("reset"),
              danger: true,
            });
            if (!mode) return;
            const result = await invoke("git/reset", { hash: commit.hash, mode: String(mode).trim().toLowerCase() });
            toast(result.ok ? `${t("reset")} --${mode} ${commit.short}` : result.message, result.ok ? "info" : "error");
            await refresh();
          },
        },
        {
          label: t("editCommitMessage"),
          disabled: !isHead,
          title: isHead ? t("editCommitMessage") : `${t("editCommitMessage")} — ${t("head")} only`,
          onSelect: async () => {
            const message = await dialog({
              title: t("editCommitMessage"),
              message: commit.subject,
              input: { value: commit.subject },
              confirmLabel: t("ok"),
            });
            if (!message) return;
            const result = await invoke("git/amend-message", { message });
            toast(result.ok ? t("editCommitMessage") : result.message, result.ok ? "info" : "error");
            await refresh();
          },
        },
      ]);
    }

    async function select(hash) {
      state.selection = hash;
      paintList();
      const [files, details] = await Promise.all([
        invoke("git/commit-files", { hash }),
        invoke("git/commit-diff", { hash }),
      ]);
      state.changedFiles = files.files ?? [];
      state.details = details.meta ?? null;
      paintDetail();
    }

    async function loadLog() {
      const result = await invoke("git/log", {
        limit: 200,
        branch: state.branchFilter || undefined,
        firstParent: state.firstParent,
        noMerges: state.noMerges,
        topo: state.topo,
      });
      state.commits = result.commits ?? [];
      if (state.selection && !state.commits.some((commit) => commit.hash === state.selection)) {
        state.selection = null;
        state.changedFiles = [];
        state.details = null;
      }
      paintList();
      paintDetail();
      if (!state.selection && state.commits.length) await select(state.commits[0].hash);
    }

    async function loadBranches() {
      const result = await invoke("git/branches");
      state.branches = result.branches ?? [];
      paintBranches();
    }

    async function refresh() {
      const repo = await invoke("git/repo");
      state.repo = repo.ok ? repo : null;
      state.error = repo.ok ? null : (repo.message ?? t("notARepository"));
      state.repoPath = repo.ok ? null : await currentFolder();
      await Promise.all([loadBranches(), loadLog()]);
      branchWidget.update(state.repo);
      paintToolbar();
    }

    /** The folder to name in the "not a repository" message. */
    async function currentFolder() {
      const workspace = await invoke("workspace.get");
      return workspace?.path ?? null;
    }

    branchesPane.append(
      h("div", { class: "pane-header" }, [h("span", { text: t("branches") })]),
      branchesHost,
    );
    detailPane.append(
      h("div", { class: "pane-header" }, [
        h("span", { text: t("changedFiles") }),
        h("div", { class: "toolbar-spacer" }),
        iconButton("diff", tip("showDiff", KEYS.showDiff), () => openCommitDiff(null), { size: 13 }),
      ]),
      changedHost,
      h("div", { class: "pane-header", style: { borderTop: "1px solid var(--border-soft)" } }, [
        h("span", { text: t("commitDetails") }),
      ]),
      detailsHost,
    );
    commitsPane.append(listHost, splitter, detailPane);
    panes.append(branchesPane, h("div", { class: "divider-v" }), commitsPane);
    root.append(toolbar, panes);

    PIG.bindSplitter(splitter, (delta) => {
      const total = commitsPane.clientHeight || 1;
      state.detailHeight = Math.max(18, Math.min(80, state.detailHeight - (delta / total) * 100));
      detailPane.style.height = `${state.detailHeight}%`;
    }, { vertical: true });

    PIG.bindShortcuts([
      { spec: KEYS.refresh, run: () => { refresh().catch(() => {}); } },
      { spec: KEYS.refreshAlt, run: () => { refresh().catch(() => {}); } },
      { spec: KEYS.showDiff, run: () => { if (state.selection) openCommitDiff(null); } },
      { spec: KEYS.find, run: () => { searchButton.click(); } },
      // The app's own accelerators cannot reach this webContents; say so.
      PIG.appShortcutHintBinding(),
    ]);

    PIG.watchWorkspace(() => { refresh().catch(() => {}); });
    refresh().catch((error) => toast(String(error?.message ?? error), "error"));

    return { refresh, selectCommit: select, openCommitDiff };
  }

  function mountConsole(root) {
    const state = { entries: [] };
    const toolbar = h("div", { class: "toolbar" });
    const host = h("div", { class: "console" });

    function paint() {
      PIG.clear(toolbar);
      toolbar.append(iconButton("refresh", tip("refresh", KEYS.refresh), () => refresh()));
      toolbar.append(h("button", {
        class: "bordered",
        type: "button",
        text: t("clearAll"),
        onclick: async () => {
          await invoke("git/console-clear");
          state.entries = [];
          paint();
        },
      }));
      toolbar.append(h("div", { class: "toolbar-spacer" }));
      toolbar.append(h("span", { class: "muted", style: { fontSize: "11px" }, text: `${state.entries.length}` }));

      PIG.clear(host);
      if (!state.entries.length) {
        host.append(h("div", { class: "empty-state" }, [h("div", { class: "headline", text: t("console") })]));
        return;
      }
      for (const entry of state.entries) {
        const node = h("div", { class: "console-entry" }, [
          h("div", { class: "console-cmd" }, [
            h("span", { class: "console-time", text: `[${PIG.formatClock(entry.ts)}] ` }),
            `$ ${entry.command}`,
          ]),
        ]);
        if (entry.stdout?.trim()) node.append(h("pre", { class: "console-out", text: entry.stdout.trimEnd() }));
        if (entry.stderr?.trim()) node.append(h("pre", { class: "console-out failure", text: entry.stderr.trimEnd() }));
        if (!entry.ok && entry.message) node.append(h("pre", { class: "console-out failure", text: entry.message }));
        host.append(node);
      }
      host.scrollTop = host.scrollHeight;
    }

    async function refresh() {
      const result = await invoke("git/console");
      state.entries = result.entries ?? [];
      paint();
    }

    root.append(toolbar, host);
    refresh().catch(() => {});
    return { refresh };
  }

  /** Tabs over Log and Console, which is exactly IDEA's Git tool window. */
  function mountGitWindow(root) {
    const tabs = h("div", { class: "tabs" });
    const logSurface = h("div", { class: "column grow" });
    const consoleSurface = h("div", { class: "column grow hidden" });

    const logView = mountLog(logSurface);
    const consoleView = mountConsole(consoleSurface);

    let active = "log";
    function paintTabs() {
      PIG.clear(tabs);
      for (const tab of [{ id: "log", label: t("log") }, { id: "console", label: t("console") }]) {
        tabs.append(h("button", {
          type: "button",
          role: "tab",
          "aria-selected": active === tab.id ? "true" : "false",
          text: tab.label,
          onclick: () => {
            active = tab.id;
            logSurface.classList.toggle("hidden", active !== "log");
            consoleSurface.classList.toggle("hidden", active !== "console");
            paintTabs();
            if (active === "console") consoleView.refresh();
          },
        }));
      }
    }
    paintTabs();

    root.append(tabs, logSurface, consoleSurface);
    window.addEventListener("pig:appearance", paintTabs);
    return { refresh: () => { logView.refresh(); if (active === "console") consoleView.refresh(); } };
  }

  /** The detached panel hosts both tool windows behind one tab bar. */
  function mountBoth(root) {
    const tabs = h("div", { class: "tabs" });
    const commitSurface = h("div", { class: "column grow" });
    const gitSurface = h("div", { class: "column grow hidden" });
    let active = "commit";

    PIG.commitView.mount(commitSurface);
    mountGitWindow(gitSurface);

    function paintTabs() {
      PIG.clear(tabs);
      // The Git tab holds the Log *and* Console, so labelling it "Log" would
      // collide with the tab inside it.
      for (const tab of [{ id: "commit", label: t("commit") }, { id: "git", label: t("git") }]) {
        tabs.append(h("button", {
          type: "button",
          role: "tab",
          "aria-selected": active === tab.id ? "true" : "false",
          text: tab.label,
          onclick: () => {
            active = tab.id;
            commitSurface.classList.toggle("hidden", active !== "commit");
            gitSurface.classList.toggle("hidden", active !== "git");
            paintTabs();
          },
        }));
      }
    }
    paintTabs();
    root.append(tabs, commitSurface, gitSurface);
    window.addEventListener("pig:appearance", paintTabs);
  }

  function boot() {
    const root = document.getElementById("app");
    if (!root) return;
    PIG.watchAppearance();
    const surface = window.__PI_IDEA_GIT_SURFACE__ ?? "commit";
    if (surface === "git") {
      mountGitWindow(root);
      return;
    }
    if (surface === "commit") {
      PIG.commitView.mount(root);
      return;
    }
    mountBoth(root);
  }

  PIG.gitView = { mount: mountGitWindow, mountLog, mountConsole, assignLanes, openDiffOverlay };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})(window.PIG || (window.PIG = {}));

})();
    </script>
  </body>
</html>
